name: Auto Expire & Reassign

on:
  schedule:
    - cron: "*/15 * * * *"   # Every 15 minutes
  workflow_dispatch: {}       # Manual run

jobs:
  reassign_job:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # 1️⃣ Create service-account.json from GitHub Secrets
      - name: Create service account file
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT }}' > ./service-account.json

      # 2️⃣ Install required dependencies
      - name: Install dependencies
        run: |
          npm init -y
          npm install firebase-admin @sanity/client node-fetch

      # 3️⃣ Run reassign.js script
      - name: Run reassignment script
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: node reassign.js
